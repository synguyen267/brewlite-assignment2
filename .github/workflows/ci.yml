name: CI

# Chạy khi mở pull request, và được pipeline CD gọi lại làm cổng chất lượng
# (workflow_call) trước khi build image.
on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Chỉ để Prisma đọc được cấu hình khi generate; CI không kết nối database.
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: API integration and e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brewlite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brewlite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brewlite
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration and e2e tests
        run: npm run test:e2e

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test --if-present

      - name: Build
        run: npm run build
